<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="AI learning experience studio">
  <!-- App icon used as the browser-tab favicon across every route. A simple
       2x2 grid nods to the interactive matrix exercises the site hosts. -->
  <rect width="32" height="32" rx="7" fill="#6d28d9" />
  <g fill="#ffffff">
    <rect x="8" y="8" width="7" height="7" rx="1.5" />
    <rect x="17" y="8" width="7" height="7" rx="1.5" />
    <rect x="8" y="17" width="7" height="7" rx="1.5" />
    <rect x="17" y="17" width="7" height="7" rx="1.5" fill="#c4b5fd" />
  </g>
</svg>
